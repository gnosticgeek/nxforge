# Publishes the GitHub release for a vX.Y.Z tag (UPSTREAM.md, Versions): checks the tag against CHANGELOG.md and
# BACKLOG.md with scripts/release_check.py, then creates the release "NXForge X.Y.Z" with that version's CHANGELOG
# entry as its notes. A sidebar-vX.Y.Z tag is the in-game sidebar's own release: checked against SIDEBAR_CHANGELOG.md
# and SIDEBAR_VERSION in dm/host/quick_settings_mac.swift, published as "NXForge Sidebar X.Y.Z"; a converter-vX.Y.Z tag
# likewise is the Converter app's (CONVERTER_CHANGELOG.md, CONVERTER_VERSION in app/Sources/NXForgeConverter/Version.swift). A release that already exists is left as it is. Run it by hand (workflow_dispatch) for a tag
# that was pushed before this workflow existed.
name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'sidebar-v[0-9]+.[0-9]+.[0-9]+', 'converter-v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: 'The tag to publish, vX.Y.Z, sidebar-vX.Y.Z or converter-vX.Y.Z'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    name: GitHub release from the changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false
      - name: Check the tag against its changelog
        run: python3 scripts/release_check.py check "$TAG"
      - name: Publish the release
        run: |
          read -r _ _ title < <(python3 scripts/release_check.py tag "$TAG")
          python3 scripts/release_check.py notes "$TAG" > "$RUNNER_TEMP/notes.md"
          # A sidebar or converter release never takes "Latest" from NXForge's own release
          latest=--latest; case "$TAG" in sidebar-*|converter-*) latest=--latest=false;; esac
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::$TAG already has a release; left as it is"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$title" --notes-file "$RUNNER_TEMP/notes.md" "$latest"
          fi
